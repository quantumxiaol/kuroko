[project]
name = "kuroko"
version = "0.1.0"
description = "含羞草 × 胆小菇：会害羞的机械臂装置"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "openai>=3.31.0",
    "openai-agents>=0.24.0",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
kuroko-bridge = "kuroko.server:main"
kuroko-chat = "kuroko.chat:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx[http2]>=0.28.1",
]
